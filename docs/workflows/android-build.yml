name: Build Android APK (Tauri Mobile)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Set Android SDK & NDK environment
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          # Use pre-installed NDK 26 on GitHub runner
          NDK_PATH=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Found NDK at: $NDK_PATH"
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend Assets
        working-directory: frontend
        run: npm run build

      - name: Build Tauri Android APK
        working-directory: frontend
        run: |
          npx tauri android init
          npx tauri android build --apk --target aarch64

      - name: Locate, Sign and Collect APK
        run: |
          mkdir -p release-apk
          RAW_APK=$(find frontend/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found raw APK at: $RAW_APK"
          
          # Generate signing keystore
          keytool -genkey -v -keystore release.keystore -alias billbill -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=BillBill, OU=App, O=Dev, L=Beijing, ST=Beijing, C=CN"
          
          # Find apksigner in Android SDK
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"
          
          # Sign APK with v1, v2, and v3 signatures
          $APKSIGNER sign --ks release.keystore --ks-pass pass:123456 --ks-key-alias billbill --key-pass pass:123456 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out release-apk/BillBillDownloader-v1.0.1-arm64.apk "$RAW_APK"
          
          # Verify signature
          $APKSIGNER verify --verbose release-apk/BillBillDownloader-v1.0.1-arm64.apk
          ls -lh release-apk/

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BillBillDownloader-android-apk
          path: release-apk/BillBillDownloader-v1.0.1-arm64.apk

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release-apk/BillBillDownloader-v1.0.1-arm64.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
